name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Copy this repo onto the runner (does not install packages)
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the uv CLI (and Python from .python-version)
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Create .venv from uv.lock, including the dev group (pytest, etc.)
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
